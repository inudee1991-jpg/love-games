<script>// ---- shared co-op layer (PeerJS public broker, host-authoritative) ----
const NET={peer:null,conn:null,mode:'solo',me:0,code:'',onState:null,onStatus:null,apply:null};
function netStatus(t){NET.onStatus&&NET.onStatus(t)}
function netCode(){const a='ABCDEFGHJKMNPQRSTUVWXYZ23456789';let s='';for(let i=0;i<4;i++)s+=a[Math.random()*a.length|0];return s}
function netReady(){return typeof Peer!=='undefined'}
function netSetup(c){
  c.on('open',()=>{NET.conn=c;netStatus('connected');if(NET.mode==='host')netBroadcast();});
  c.on('data',d=>{
    if(NET.mode==='host'&&d.t==='act'){NET.apply(d.a,1);netBroadcast();NET.onState&&NET.onState();}
    else if(NET.mode==='guest'&&d.t==='state'){NET.onState&&NET.onState(d.s);}
  });
  c.on('close',()=>{NET.conn=null;netStatus('disconnected')});
}
function netHost(prefix,cb){
  if(!netReady())return netStatus('offline');
  NET.mode='host';NET.me=0;NET.code=netCode();
  NET.peer=new Peer(prefix+NET.code);
  NET.peer.on('open',()=>{netStatus('waiting');cb&&cb(NET.code)});
  NET.peer.on('connection',c=>{if(NET.conn)NET.conn.close();netSetup(c)});
  NET.peer.on('error',e=>{if(e.type==='unavailable-id'){NET.peer.destroy();netHost(prefix,cb)}else netStatus('error: '+e.type)});
}
function netJoin(prefix,code){
  if(!netReady())return netStatus('offline');
  NET.mode='guest';NET.me=1;NET.code=code.toUpperCase().trim();
  NET.peer=new Peer();
  NET.peer.on('open',()=>{netStatus('connecting');netSetup(NET.peer.connect(prefix+NET.code,{reliable:true}))});
  NET.peer.on('error',e=>netStatus(e.type==='peer-unavailable'?'no room with that code':'error: '+e.type));
}
let NET_GET=null; // fn returning state to broadcast
function netBroadcast(){if(NET.mode==='host'&&NET.conn&&NET.conn.open)NET.conn.send({t:'state',s:NET_GET()})}
// act: guest sends to host; host/solo apply locally
function act(a){
  if(NET.mode==='guest'){if(NET.conn&&NET.conn.open)NET.conn.send({t:'act',a});else toast('Not connected');return}
  NET.apply(a,NET.mode==='solo'?(a.p??0):0);netBroadcast();NET.onState&&NET.onState();
}
function toast(m){let t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),2200)}
// Lobby UI helper: renders into el, calls onStart(mode)
function lobbyUI(el,prefix,onStart){
  el.innerHTML=`<div class="card lob"><h3>Play together</h3>
  <button class="btn" id="lbHost">💞 Create room (2 phones)</button>
  <div class="row"><input id="lbCode" maxlength="4" placeholder="CODE" autocapitalize="characters"><button class="btn alt" id="lbJoin">Join</button></div>
  <button class="btn ghost" id="lbSolo">📱 Pass-and-play on one phone</button>
  <p id="lbStat" class="muted"></p></div>`;
  const st=el.querySelector('#lbStat');
  NET.onStatus=t=>{st.innerHTML=t==='waiting'?`Room code: <b class="code">${NET.code}</b><br>Ask your partner to open this game and tap Join.`:t==='connected'?'Connected! 💖':t==='offline'?'Online play unavailable — use pass-and-play.':t;
    if(t==='connected')onStart(NET.mode); if(t==='disconnected')toast('Partner disconnected');};
  el.querySelector('#lbHost').onclick=()=>netHost(prefix);
  el.querySelector('#lbJoin').onclick=()=>{const c=el.querySelector('#lbCode').value;if(c.length===4)netJoin(prefix,c)};
  el.querySelector('#lbSolo').onclick=()=>{NET.mode='solo';onStart('solo')};
}

(function(){const h=document.createElement('div');h.className='hearts';for(let i=0;i<14;i++){const s=document.createElement('span');s.textContent=['💗','💕','✨','🌸'][i%4];s.style.left=Math.random()*100+'%';s.style.animationDuration=(8+Math.random()*10)+'s';s.style.animationDelay=(-Math.random()*15)+'s';h.appendChild(s)}document.body.appendChild(h)})();
let SND=localStorage.getItem('snd')!=='0';function beep(f=660,d=.12){if(!SND)return;try{const a=beep.c||(beep.c=new AudioContext()),o=a.createOscillator(),g=a.createGain();o.frequency.value=f;o.type='sine';g.gain.setValueAtTime(.15,a.currentTime);g.gain.exponentialRampToValueAtTime(.001,a.currentTime+d);o.connect(g);g.connect(a.destination);o.start();o.stop(a.currentTime+d)}catch(e){}}
function chime(){beep(660);setTimeout(()=>beep(880),110);setTimeout(()=>beep(1320,.25),220)}

ning before <b>a worship song</b>.","<b>food</b> and <b>a love song</b> were on the same morning.","<b>family</b> was not on the <b>Thursday</b>."],"space":576},{"id":"table","type":"circle","title":"Sunday Dinner Table","diff":2,"story":"Five chairs around a round table, numbered 1–5 clockwise (chair 5 is next to chair 1). Who sits where?","mem":["🍲","Full Table","The friend who knew us both — we'd crossed paths before we ever said hello."],"base":["Seat 1","Seat 2","Seat 3","Seat 4","Seat 5"],"cats":[{"n":"Person","v":["Delene","Rod","Gio","Abuela","Our Matchmaker Friend"]}],"sol":[[0,3,2,4,1]],"clues":["<b>Gio</b> is not in seat 2.","<b>Abuela</b> sits in the chair just clockwise of <b>Delene</b>.","<b>Gio</b> sits in the chair just clockwise of <b>Abuela</b>.","<b>Delene</b> is not in seat 2.","<b>Abuela</b> is not in seat 5.","<b>Rod</b> is not in seat 2.","<b>Delene</b> sits next to <b>Rod</b>."],"space":120},{"id":"alaska","type":"logic","title":"Alaska Cruise","diff":3,"story":"Four days at sea with Gio. Each day had a port, an adventure, and the toy Gio insisted on carrying.","mem":["🐋","Alaska Wonders","Whales, glaciers, and a little boy pointing at everything — creation is good."],"base":["Day 1","Day 2","Day 3","Day 4"],"cats":[{"n":"Port","v":["Juneau","Ketchikan","Skagway","Glacier Bay"]},{"n":"Activity","v":["whale watching","a mountain train","a totem walk","glacier viewing"]},{"n":"Toy","v":["the cowboy","the space ranger","the race car","the teddy"]}],"sol":[[3,2,1,0],[0,3,2,1],[0,2,3,1]],"clues":["<b>the race car</b> came some day before <b>a mountain train</b>.","<b>the teddy</b> came the day right before <b>the space ranger</b>.","<b>whale watching</b> came some day before <b>the race car</b>.","<b>Skagway</b> and <b>the cowboy</b> were on different days.","<b>the race car</b> came the day right before <b>Ketchikan</b>.","<b>a totem walk</b> came the day right before <b>Juneau</b>.","<b>the cowboy</b> came some day before <b>the race car</b>."],"space":13824},{"id":"pew","type":"row","title":"Dedication Sunday","diff":3,"story":"Sept 27, 2026, Gio's child dedication at Christ Fellowship. Six family members in one pew, seats 1–6 left to right.","mem":["🕊️","Dedicated in Love","We gave Gio back to God with full and grateful hearts."],"base":["Seat 1","Seat 2","Seat 3","Seat 4","Seat 5","Seat 6"],"cats":[{"n":"Person","v":["Delene","Rod","Gio","Abuela","Abuelo","Nana"]}],"sol":[[1,2,0,4,5,3]],"clues":["<b>Delene</b> does not sit next to <b>Abuela</b>.","<b>Abuela</b> does not sit next to <b>Abuelo</b>.","<b>Delene</b> is not in seat 4.","<b>Delene</b> sits somewhere left of <b>Abuela</b>.","<b>Gio</b> sits somewhere left of <b>Delene</b>.","<b>Rod</b> sits somewhere left of <b>Gio</b>."],"space":720},{"id":"mile","type":"logic","title":"Chapters of Us","diff":4,"story":"Five chapters, five milestones, five keepsakes in our memory box. Place each one.","mem":["💍","Chapters of Us","Message → ring at 11 months → home 5 months later → \"I do\" → our rainbow baby."],"base":["Chapter 1","Chapter 2","Chapter 3","Chapter 4","Chapter 5"],"cats":[{"n":"Milestone","v":["the first message","the proposal","the new home","the wedding","Gio's birth"]},{"n":"Keepsake","v":["a screenshot","a ring box","a house key","a vow booklet","a tiny hospital bracelet"]}],"sol":[[0,1,2,3,4],[2,0,3,4,1]],"clues":["<b>a vow booklet</b> came some chapter before <b>a ring box</b>.","<b>a vow booklet</b> came the chapter right before <b>the wedding</b>.","<b>the proposal</b> came some chapter before <b>the new home</b>.","<b>the first message</b> and <b>a screenshot</b> were on different chapters.","<b>the first message</b> came the chapter right before <b>the proposal</b>.","<b>the new home</b> and <b>a vow booklet</b> were on the same chapter.","<b>a vow booklet</b> came the chapter right before <b>a tiny hospital bracelet</b>."],"space":14400},{"id":"anniv","type":"circle","title":"Anniversary Dinner Party","diff":4,"story":"A round table const KEY='storyofus_v1';const cap=s=>s.replace(/^(<b>)?(.)/,(m,b,c)=>(b||'')+c.toUpperCase());
let S=JSON.parse(localStorage.getItem(KEY)||'null')||{ans:{},notes:{},solved:[],split:true,msg:{}};
let tab='list',cur=null,showNotes=false;NET_GET=()=>S;
function save(){localStorage.setItem(KEY,JSON.stringify(S))}
function A(p){return S.ans[p.id]||(S.ans[p.id]=p.cats.map(()=>p.base.map(()=>-1)))}
NET.apply=(a,pl)=>{const p=PZ.find(x=>x.id===a.id);
 if(a.k==='set'){A(p)[a.c][a.b]=a.v;S.msg[p.id]=''}
 else if(a.k==='note'){const n=S.notes[p.id]||(S.notes[p.id]={});const k=a.c+','+a.b+','+a.v;n[k]=((n[k]||0)+1)%3}
 else if(a.k==='check'){const an=A(p);const ok=JSON.stringify(an)===JSON.stringify(p.sol);if(ok){if(!S.solved.includes(p.id))S.solved.push(p.id);S.msg[p.id]='ok'}else{const filled=an.every(r=>r.every(v=>v>=0));S.msg[p.id]=filled?'Not quite — re-read the clues together.':'Fill in every answer first.'}}
 else if(a.k==='clear'){delete S.ans[p.id];delete S.notes[p.id];S.msg[p.id]=''}
 else if(a.k==='split'){S.split=!S.split}
 save()};
let lastSolved=S.solved.length;
NET.onState=s=>{if(s){S=s;save()}if(S.solved.length>lastSolved){chime();lastSolved=S.solved.length}render()};
const app=document.getElementById('app');
function unlocked(i){return i===0||S.solved.includes(PZ[i-1].id)}
function sel(p,c,b){const an=A(p),used=new Set(an[c].filter((v,i)=>i!==b&&v>=0));return `<select onchange="act({k:'set',id:'${p.id}',c:${c},b:${b},v:+this.value})"><option value="-1">—</option>${p.cats[c].v.map((v,vi)=>`<option value="${vi}" ${an[c][b]===vi?'selected':''}>${used.has(vi)?'· ':''}${v}</option>`).join('')}</select>`}
function render(){document.getElementById('tabs').style.display='flex';document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('on',b.dataset.t===tab));
 let h=`<h1>Story of Us</h1><p class="muted">${NET.mode==='solo'?'solving together on one phone':'room '+NET.code+(NET.conn?' · 💞 connected':' · waiting for partner')}</p>`;
 if(tab==='list'&&!cur){h+=`<div class="card"><p class="muted">Solve each puzzle together to unlock a memory card. ${S.solved.length}/${PZ.length} solved.</p>${PZ.map((p,i)=>`<button class="btn ${S.solved.includes(p.id)?'alt':''}" ${unlocked(i)?'':'disabled'} onclick="cur='${p.id}';render()"><div class="pz"><span>${i+1}. ${p.title}</span><span>${'💗'.repeat(p.diff)} ${S.solved.includes(p.id)?'✓':unlocked(i)?'':'🔒'}</span></div></button>`).join('')}</div>`}
 else if(tab==='list'){const p=PZ.find(x=>x.id===cur),an=A(p),co=NET.mode!=='solo'&&S.split;
  h+=`<button class="btn ghost" onclick="cur=null;render()">← All puzzles</button><div class="card"><h2>${p.title}</h2><p><i>${p.story}</i></p><span class="tag">${p.type==='logic'?'Logic grid':p.type==='row'?'Seating · row':'Seating · round table'}</span><span class="tag">Difficulty ${'💗'.repeat(p.diff)}</span>
  <h3>Clues ${co?'<span class="muted">(split between your phones — read yours aloud!)</span>':''}</h3>${p.clues.map((c,i)=>co&&i%2!==NET.me?`<div class="clue hid">🔒 Clue ${i+1} is on your partner's phone</div>`:`<div class="clue">${i+1}. ${cap(c)}</div>`).join('')}</div><div class="card">`;
  if(p.type==='logic'){h+=`<table><tr><th></th>${p.cats.map(c=>`<th>${c.n}</th>`).join('')}</tr>${p.base.map((b,bi)=>`<tr><th class="r">${b}</th>${p.cats.map((c,ci)=>`<td>${sel(p,ci,bi)}</td>`).join('')}</tr>`).join('')}</table>`}
  else if(p.type==='row'){h+=`<p class="muted">⬅ left · seats in a row · right ➡</p><div class="rowseats" style="grid-template-columns:repeat(${p.base.length},1fr)">${p.base.map((b,bi)=>`<div style="text-align:center">💺<br><small>${bi+1}</small>${sel(p,0,bi)}</div>`).join('')}</div>`}
  else{const n=p.base.length;h+=`<div class="circle"><div class="tbl">🍽️</div>${p.base.map((b,bi)=>{const a=-Math.PI/2+bi*2*Math.PI/n;return `<div class="seat" style="left:${50+40*Math.cos(a)}%;top:${50+40*Math.sin(a)}%">Chair ${bi+1}${sel(p,0,bi)}</div>`}).join('')}</div><p class="muted">Chairs go clockwise.</p>`}
  h+=`<button class="btn ghost" onclick="showNotes=!showNotes;render()">✏️ ${showNotes?'Hide':'Show'} scratch grid (tap: ✗ → ✓ → blank)</button>`;
  if(showNotes){const nt=S.notes[p.id]||{};p.cats.forEach((c,ci)=>{h+=`<table class="ng" style="margin:8px 0"><tr><th class="r">${c.n}</th>${p.base.map(b=>`<th>${b}</th>`).join('')}</tr>${c.v.map((v,vi)=>`<tr><th class="r">${v}</th>${p.base.map((b,bi)=>`<td onclick="act({k:'note',id:'${p.id}',c:${ci},b:${bi},v:${vi}})">${['','✗','✓'][nt[ci+','+bi+','+vi]||0]}</td>`).join('')}</tr>`).join('')}</table>`})}
  const m=S.msg[p.id];h+=`<button class="btn" onclick="act({k:'check',id:'${p.id}'})">💞 Check our answer</button><button class="btn ghost" onclick="if(confirm('Clear this puzzle?'))act({k:'clear',id:'${p.id}'})">Clear</button>${m&&m!=='ok'?`<p style="text-align:center">${m}</p>`:''}</div>`;
  if(S.solved.includes(p.id))h+=`<div class="card mc"><div class="e">${p.mem[0]}</div><h2>${p.mem[1]}</h2><p><i>${p.mem[2]}</i></p><p class="muted">Memory card unlocked! 💌</p></div>`}
 if(tab==='album'){h+=`<div class="card"><h2>Our Memories</h2><div class="plist" style="grid-template-columns:1fr 1fr">${PZ.map(p=>S.solved.includes(p.id)?`<div class="mc"><div class="e">${p.mem[0]}</div><b>${p.mem[1]}</b><p style="font-size:.85rem"><i>${p.mem[2]}</i></p></div>`:`<div class="mc lock"><div class="e">🔒</div><b>${p.title}</b></div>`).join('')}</div>
  <p class="muted" style="margin-top:14px">🌟 And always, a quiet place in our hearts for the little one we carry with love.</p>${S.solved.length===PZ.length?'<p style="text-align:center;font-size:1.2rem"><b>Our story isn\'t finished. 💞</b></p>':''}</div>`}
 if(tab==='set')h+=`<div class="card"><button class="btn ghost" onclick="act({k:'split'})">Split clues between phones: ${S.split?'ON':'OFF'}</button><button class="btn ghost" onclick="SND=!SND;localStorage.setItem('snd',SND?1:0);render()">Sound ${SND?'🔊':'🔇'}</button><button class="btn ghost" onclick="if(confirm('Reset progress on this phone?')){localStorage.removeItem(KEY);location.reload()}">Reset progress</button><p class="muted">Every puzzle has exactly one solution (computer-verified).</p></div>`;
 app.innerHTML=h}
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{tab=b.dataset.t;cur=tab==='list'?cur:null;render()});
app.innerHTML='<h1>Story of Us</h1><p class="muted">Logic & seating puzzles from your love story. Solve together, unlock memories.</p><div class="card" style="text-align:center;font-size:3rem">🧩💌🌅🐋🕊️</div><div id="lobby"></div>';
lobbyUI(document.getElementById('lobby'),'storyofus-dr-',()=>render());
</script></body></html>
